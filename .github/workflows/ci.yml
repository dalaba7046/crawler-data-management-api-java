name: CI

# 每次 push 或對 main 發 PR 時，自動編譯並跑整合測試。
# 測試使用 H2 in-memory（dev profile），不需外接資料庫。
on:
  push:
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Build and run tests
        run: mvn -B test
