# dev profile：H2 in-memory，以 MS SQL Server 相容模式執行
# 用途：本機免裝資料庫即可 mvn spring-boot:run 起來看 API
spring.datasource.url=jdbc:h2:mem:crawlerdb;MODE=MSSQLServer;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 開啟 H2 console（http://localhost:8000/h2-console）方便看資料
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
