# ============================================================
# 預設使用 dev profile：H2 in-memory，本機免裝任何資料庫即可啟動驗證
# 對齊 MS SQL 行為（H2 以 MSSQLServer 相容模式執行）
# 若要連真正的 MS SQL Server，啟動時加：--spring.profiles.active=mssql
# ============================================================
spring.profiles.active=dev
server.port=8000

# Swagger UI（對應 FastAPI 內建 /docs）：啟動後開 http://localhost:8000/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
