# mssql profile：連真正的 Microsoft SQL Server（對齊京城 JD 的 MS SQL 要求）
# 啟動：mvn spring-boot:run -Dspring-boot.run.profiles=mssql
# 或：java -jar target/crawler-data-management-api-1.0.0.jar --spring.profiles.active=mssql
#
# 連線資訊可用環境變數覆寫，避免把帳密寫死在程式碼：
#   MSSQL_HOST / MSSQL_PORT / MSSQL_DB / MSSQL_USER / MSSQL_PASSWORD
spring.datasource.url=jdbc:sqlserver://${MSSQL_HOST:localhost}:${MSSQL_PORT:1433};databaseName=${MSSQL_DB:crawler_data};encrypt=true;trustServerCertificate=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${MSSQL_USER:sa}
spring.datasource.password=${MSSQL_PASSWORD:Your_password123}

# 正式環境用既有資料表（schema-mssql.sql 已建好），不讓 Hibernate 改結構
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.SQLServer2012Dialect
spring.jpa.show-sql=false
